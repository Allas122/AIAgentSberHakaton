name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (latest, or sha-<full commit sha> to roll back)"
        required: true
        default: latest
        type: string
      rollback_on_failure:
        description: "Restore the previous version automatically if the health check fails"
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || {
            echo "DEPLOY_SSH_KEY is not a valid private key"
            exit 1
          }

      - name: Log in to GHCR on the server
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Sync compose files
        run: |
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            docker-compose.yml docker-compose.prod.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/app/"

      - name: Run deploy
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "IMAGE_TAG='${{ inputs.tag }}' ROLLBACK_ON_FAILURE='${{ inputs.rollback_on_failure && '1' || '0' }}' bash -s" < deploy/remote-deploy.sh

      - name: Log out of GHCR on the server
        if: always()
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker logout ghcr.io" || true
