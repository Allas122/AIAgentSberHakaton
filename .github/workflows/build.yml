name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: chatnode
            context: .
            dockerfile: ChatNode/Dockerfile
            build_args: ""
          - service: web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: ""
          - service: anonymizer
            context: ./AnonimyzeService
            dockerfile: ./AnonimyzeService/Dockerfile
            build_args: |
              PII_MODEL_SOURCE=${{ vars.PII_MODEL_SOURCE || 'Wismut/nym-pii-multilingual' }}
              PII_MODEL_REVISION=${{ vars.PII_MODEL_REVISION }}

    name: build ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
