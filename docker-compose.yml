name: ${COMPOSE_PROJECT_NAME:-aiagent-sber}

services:
  valkey:
    image: valkey/valkey-bundle:8.1
    container_name: ${COMPOSE_PROJECT_NAME:-aiagent-sber}-valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - grants

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: ${COMPOSE_PROJECT_NAME:-aiagent-sber}-seaweedfs
    restart: unless-stopped
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -master.volumeSizeLimitMB=${SEAWEEDFS_VOLUME_SIZE_MB:-1024}
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
    volumes:
      - seaweedfs-data:/data
    networks:
      - grants

  seaweedfs-init:
    image: curlimages/curl:8.11.1
    container_name: ${COMPOSE_PROJECT_NAME:-aiagent-sber}-seaweedfs-init
    depends_on:
      - seaweedfs
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf -o /dev/null http://seaweedfs:8333/; do
          echo "waiting for seaweedfs s3..."
          sleep 2
        done
        curl -sf -X PUT "http://seaweedfs:8333/${S3_BUCKET:-grants}"
        echo "bucket '${S3_BUCKET:-grants}' is ready"
    networks:
      - grants

  anonymizer:
    build:
      context: ./AnonimyzeService
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-aiagent-sber}/anonymizer:latest
    container_name: ${COMPOSE_PROJECT_NAME:-aiagent-sber}-anonymizer
    restart: unless-stopped
    environment:
      PORT: "50051"
      LOG_LEVEL: ${ANONYMIZER_LOG_LEVEL:-INFO}
      HF_HOME: /models
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      PII_MODEL_ID: ${PII_MODEL_ID:-Wismut/nym-pii-multilingual}
      PII_MODEL_REVISION: ${PII_MODEL_REVISION:-}
      REDACT_TYPES: ${REDACT_TYPES:-}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-20000}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-400}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-50}
      GRPC_MAX_WORKERS: ${GRPC_MAX_WORKERS:-10}
      GRPC_MAX_MESSAGE_MB: ${GRPC_MAX_MESSAGE_MB:-50}
    volumes:
      - hf-cache:/models
    ports:
      - "${ANONYMIZER_PORT:-50051}:50051"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 50051), 3).close()
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: ${ANONYMIZER_START_PERIOD:-600s}
    networks:
      - grants

  chatnode:
    build:
      context: .
      dockerfile: ChatNode/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-aiagent-sber}/chatnode:latest
    container_name: ${COMPOSE_PROJECT_NAME:-aiagent-sber}-chatnode
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      anonymizer:
        condition: service_healthy
    ports:
      - "${CHATNODE_HTTP_PORT:-5064}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      Logging__LogLevel__Default: ${LOG_LEVEL_DEFAULT:-Information}
      Logging__LogLevel__Microsoft.AspNetCore: ${LOG_LEVEL_ASPNETCORE:-Warning}

      ConnectionStrings__Valkey: ${VALKEY_CONNECTION:-valkey:6379}
      ConnectionStrings__AnonimyzeService: ${ANONYMIZER_CONNECTION:-http://anonymizer:50051}

      S3__ServiceUrl: ${S3_SERVICE_URL:-http://seaweedfs:8333}
      S3__AccessKey: ${S3_ACCESS_KEY:-any}
      S3__SecretKey: ${S3_SECRET_KEY:-any}
      S3__BucketName: ${S3_BUCKET:-grants}
      S3__ForcePathStyle: ${S3_FORCE_PATH_STYLE:-true}
      S3__UseHttp: ${S3_USE_HTTP:-true}

      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (32+ chars)}
      Jwt__Issuer: ${JWT_ISSUER:-ChatNode}
      Jwt__Audience: ${JWT_AUDIENCE:-ChatNodeClients}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_DAYS:-1}

      WebSocket__TicketExpirationInSeconds: ${WS_TICKET_EXPIRATION_SECONDS:-30}

      ExpirationPolicy__UserExpirationSeconds: ${EXPIRATION_USER_SECONDS:-86400}
      ExpirationPolicy__ChatExpirationSeconds: ${EXPIRATION_CHAT_SECONDS:-86400}
      ExpirationPolicy__MessageStreamExpirationSeconds: ${EXPIRATION_MESSAGE_STREAM_SECONDS:-86400}
      ExpirationPolicy__PinExpirationSeconds: ${EXPIRATION_PIN_SECONDS:-86400}

      GigaChat__AuthorizationKey: ${GIGACHAT_AUTHORIZATION_KEY:?GIGACHAT_AUTHORIZATION_KEY is required}
      GigaChat__Scope: ${GIGACHAT_SCOPE:-GIGACHAT_API_B2B}
      GigaChat__AuthUrl: ${GIGACHAT_AUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GigaChat__BaseUrl: ${GIGACHAT_BASE_URL:-https://api.giga.chat/v1}
      GigaChat__ManualParserAgentModel: ${GIGACHAT_MANUAL_PARSER_MODEL:-GigaChat-2-Max}
      GigaChat__ConsultingAgentModel: ${GIGACHAT_CONSULTING_MODEL:-GigaChat-2-Pro}
      GigaChat__ApplicationReviewAgentModel: ${GIGACHAT_REVIEW_MODEL:-GigaChat-2-Max}
      GigaChat__EmbeddingModel: ${GIGACHAT_EMBEDDING_MODEL:-Embeddings}
      GigaChat__EmbeddingDim: ${GIGACHAT_EMBEDDING_DIM:-1024}
      GigaChat__ApplicationSectionChars: ${GIGACHAT_SECTION_CHARS:-4000}
      GigaChat__ApplicationSectionToolCalls: ${GIGACHAT_SECTION_TOOL_CALLS:-12}
      GigaChat__PinDuplicateDistance: ${GIGACHAT_PIN_DUPLICATE_DISTANCE:-0.15}
      GigaChat__PinSearchDistance: ${GIGACHAT_PIN_SEARCH_DISTANCE:-0.55}
      GigaChat__TimeoutMinutes: ${GIGACHAT_TIMEOUT_MINUTES:-10}
      GigaChat__MaxRetries: ${GIGACHAT_MAX_RETRIES:-4}
      GigaChat__RetryBackoffFactor: ${GIGACHAT_RETRY_BACKOFF_FACTOR:-1.0}
      GigaChat__TransportRetries: ${GIGACHAT_TRANSPORT_RETRIES:-3}
      GigaChat__MaxOperationAttempts: ${GIGACHAT_MAX_OPERATION_ATTEMPTS:-2}
      GigaChat__OperationRetryDelaySeconds: ${GIGACHAT_OPERATION_RETRY_DELAY_SECONDS:-5}
    networks:
      - grants

networks:
  grants:
    driver: bridge

volumes:
  valkey-data:
  seaweedfs-data:
  hf-cache:
